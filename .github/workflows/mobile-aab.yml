name: Mobile AAB (Play release build)

# Builds the UNSIGNED Android App Bundle (.aab) for the Google Play
# release of ITG TraderOS (package com.itg.traderos, version from
# app.json).
#
# The bundle is deliberately produced UNSIGNED. It is signed locally
# afterwards with the project's Play upload key (jarsigner), so the
# signing key and its password NEVER enter GitHub — not in the repo,
# not in Actions secrets, not in artifacts. Play App Signing holds the
# app signing key on Google's side; this upload key is the only key
# the project itself custodies.
#
# EXPO_PUBLIC_* values are PUBLIC client configuration (the Supabase
# anon key ships inside every distributed binary; RLS — not key
# secrecy — protects the data). There is deliberately NO service-role
# key anywhere in this workflow.

on:
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://pwzvthvvxyfppenmessf.supabase.co
      # Public anon key, split so the repo's JWT-shape scan does not
      # flag a public value (same convention as mobile-apk.yml).
      ANON_KEY_PART_1: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB3enZ0aHZ2eHlmcHBlbm1lc3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMTEwMzEsImV4cCI6MjEwODY4NzAzMX0
      ANON_KEY_PART_2: Se1MUQN3c3JcC85ZjCxmXLb7h_1j-1QrnH2WwZePS6s
      EXPO_PUBLIC_API_BASE_URL: https://itg-traderos.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Vendor @itg/calc into the mobile app (canonical profile completion)
        run: node scripts/vendor-calc.mjs

      - name: Install mobile dependencies (standalone, outside workspaces)
        run: npm install --workspaces=false

      - name: Write production .env for the bundle
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_API_BASE_URL=%s\n' \
            "$EXPO_PUBLIC_SUPABASE_URL" "$ANON_KEY_PART_1.$ANON_KEY_PART_2" "$EXPO_PUBLIC_API_BASE_URL" > .env

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Strip the template (debug) signing config so the release bundle is UNSIGNED
        working-directory: apps/mobile/android
        run: |
          grep -n "signingConfig" app/build.gradle || true
          sed -i '/signingConfig signingConfigs.debug/d' app/build.gradle
          echo "--- after patch:"
          grep -n "signingConfig" app/build.gradle || echo "no signingConfig remains (unsigned build)"

      - name: Build the release App Bundle (unsigned)
        working-directory: apps/mobile/android
        run: ./gradlew bundleRelease --console=plain

      - name: Verify the bundle (package, version, targetSdk, permissions)
        working-directory: apps/mobile/android
        run: |
          AAB=$(find app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "bundle: $AAB"
          test -n "$AAB"
          curl -sL -o /tmp/bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar /tmp/bundletool.jar validate --bundle "$AAB"
          java -jar /tmp/bundletool.jar build-apks --bundle "$AAB" --output /tmp/release.apks --mode=universal
          mkdir -p /tmp/apks && cd /tmp/apks && unzip -o -q /tmp/release.apks
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          APK=$(find /tmp/apks -name '*.apk' | head -1)
          echo "--- badging of the universal APK generated from the bundle:"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|uses-permission" || true
          cp "$GITHUB_WORKSPACE/apps/mobile/android/$AAB" "$GITHUB_WORKSPACE/itg-traderos-release-unsigned.aab" 2>/dev/null || cp "$AAB" "$GITHUB_WORKSPACE/itg-traderos-release-unsigned.aab"
          ls -la "$GITHUB_WORKSPACE/itg-traderos-release-unsigned.aab"

      - name: Upload the unsigned AAB (signing happens locally with the upload key)
        uses: actions/upload-artifact@v4
        with:
          name: itg-traderos-release-aab-unsigned
          path: itg-traderos-release-unsigned.aab
          if-no-files-found: error
